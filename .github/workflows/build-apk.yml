name: Build REC Battery Monitor APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore stable signing key
        run: base64 -d signing/rec-monitor-debug.keystore.b64 > signing/rec-monitor-debug.keystore
      - name: Build signed APK
        run: gradle assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk REC-Battery-Monitor-v2.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: REC-Battery-Monitor-v2.0-APK
          path: REC-Battery-Monitor-v2.0.apk
          if-no-files-found: error
